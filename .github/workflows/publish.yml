# SPDX-License-Identifier: GPL-3.0-or-later
# Release flow (PyPI Trusted Publishing, no API token stored):
#   1. Push a version tag without "v" (e.g. 2.1.0)      -> build, check, upload to TestPyPI.
#   2. Publish a GitHub Release for that tag           -> build, check, upload to PyPI.
# Each upload runs in a GitHub environment ("testpypi" / "pypi") whose trusted publisher is configured on
# test.pypi.org / pypi.org for this repository and this workflow file.
name: Publish

on:
  push:
    tags: ["[0-9]+.[0-9]+.[0-9]+*"]
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check that the tag matches the package version
        run: |
          tag="${GITHUB_REF_NAME}"
          version="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          if [ "$tag" != "$version" ]; then
            echo "Tag $tag does not match pyproject.toml version $version" >&2
            exit 1
          fi
      - name: Build
        run: |
          python -m pip install --upgrade build twine
          python -m build
          python -m twine check --strict dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  testpypi:
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/p/nucleuskit-toolkit
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

  pypi:
    if: github.event_name == 'release'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/nucleuskit-toolkit
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
