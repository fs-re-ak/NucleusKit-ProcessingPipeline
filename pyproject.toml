[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nucleuskit-toolkit"
version = "2.1.0"
description = "Nucleus-Kit offline processing toolkit (Hermes EEG/EMG, Shimmer PPG/EDA)"
readme = "README.md"
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "RE-AK Technologies Inc." }]
keywords = ["EEG", "EMG", "EDA", "PPG", "Nucleus-Kit", "Hermes", "Shimmer", "biosignals"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
]
dependencies = [
    "re-ak-core>=1.0.1,<1.1",
    "numpy>=2.5",
    "pandas>=2.3",
    "scipy>=1.17,<1.18",
    "matplotlib>=3.11",
    "opencv-python>=5.0",
    "scikit-learn==1.6.*",
]

[project.urls]
Homepage = "https://github.com/fs-re-ak/NucleusKit-ProcessingPipeline"
Source = "https://github.com/fs-re-ak/NucleusKit-ProcessingPipeline"
Issues = "https://github.com/fs-re-ak/NucleusKit-ProcessingPipeline/issues"
Changelog = "https://github.com/fs-re-ak/NucleusKit-ProcessingPipeline/blob/main/CHANGELOG.md"

[project.optional-dependencies]
dev = [
    "pytest>=9",
    "ruff>=0.17",
]
gui = [
    "PySide6>=6.12",
    "bleak>=3.0",
    "pyqtgraph>=0.14",
    "pyserial>=3.5",
    "paho-mqtt>=1.6",
]

[project.scripts]
nucleuskit-toolkit = "nucleuskit_toolkit.__main__:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["nucleuskit_toolkit*"]

[tool.setuptools.package-data]
"nucleuskit_toolkit.ui.resources.branding" = ["*.png"]

[tool.ruff]
line-length = 120
target-version = "py310"
src = ["nucleuskit_toolkit", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "W"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
